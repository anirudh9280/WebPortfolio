<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Wireframe of the DS3 student org site: stacked hero headline, browser-chromed cards and a stats row">
  <rect x="0" y="0" width="640" height="400" fill="#1C1832"/>

  <g stroke="#EDEBF5" stroke-opacity="0.08" stroke-width="1">
    <line x1="34" y1="40" x2="606" y2="40"/>
    <line x1="34" y1="340" x2="606" y2="340"/>
    <line x1="34" y1="40" x2="34" y2="340"/>
    <line x1="606" y1="40" x2="606" y2="340"/>
  </g>

  <!-- The site's two radial glow blobs, teal top-left and orange bottom-right -->
  <circle cx="96" cy="86" r="78" fill="#19b5ca" fill-opacity="0.10"/>
  <circle cx="556" cy="300" r="66" fill="#f58134" fill-opacity="0.10"/>

  <!-- Eyebrow + stacked serif headline -->
  <rect x="34" y="60" width="104" height="7" fill="#19b5ca"/>
  <rect x="34" y="80" width="196" height="15" fill="#EDEBF5" fill-opacity="0.30"/>
  <rect x="34" y="102" width="152" height="15" fill="#EDEBF5" fill-opacity="0.30"/>
  <rect x="34" y="132" width="88" height="22" rx="3" fill="#f58134"/>
  <rect x="132" y="132" width="76" height="22" rx="3" fill="none" stroke="#19b5ca" stroke-width="1"/>

  <!-- Their signature component: cards chromed as browser windows -->
  <g>
    <rect x="286" y="60" width="146" height="96" rx="4" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="286" y1="78" x2="432" y2="78" stroke="#EDEBF5" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="297" cy="69" r="2.6" fill="#f58134"/>
    <circle cx="306" cy="69" r="2.6" fill="#EDEBF5" fill-opacity="0.24"/>
    <circle cx="315" cy="69" r="2.6" fill="#19b5ca"/>
    <rect x="298" y="92" width="88" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="298" y="106" width="118" height="6" fill="#EDEBF5" fill-opacity="0.12"/>
    <rect x="298" y="118" width="96" height="6" fill="#EDEBF5" fill-opacity="0.12"/>
    <rect x="298" y="136" width="54" height="10" fill="#19b5ca"/>

    <rect x="450" y="60" width="146" height="96" rx="4" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="450" y1="78" x2="596" y2="78" stroke="#EDEBF5" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="461" cy="69" r="2.6" fill="#f58134"/>
    <circle cx="470" cy="69" r="2.6" fill="#EDEBF5" fill-opacity="0.24"/>
    <circle cx="479" cy="69" r="2.6" fill="#19b5ca"/>
    <rect x="462" y="92" width="70" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="462" y="106" width="112" height="6" fill="#EDEBF5" fill-opacity="0.12"/>
    <rect x="462" y="118" width="84" height="6" fill="#EDEBF5" fill-opacity="0.12"/>
    <rect x="462" y="136" width="54" height="10" fill="#f58134"/>
  </g>

  <!-- The count-up statistics row he added, gated to fire on scroll -->
  <g>
    <line x1="34" y1="188" x2="606" y2="188" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="34" y="206" width="60" height="20" fill="#19b5ca" fill-opacity="0.85"/>
    <rect x="34" y="232" width="86" height="6" fill="#EDEBF5" fill-opacity="0.14"/>

    <rect x="186" y="206" width="48" height="20" fill="#f58134" fill-opacity="0.85"/>
    <rect x="186" y="232" width="74" height="6" fill="#EDEBF5" fill-opacity="0.14"/>

    <rect x="330" y="206" width="66" height="20" fill="#19b5ca" fill-opacity="0.85"/>
    <rect x="330" y="232" width="92" height="6" fill="#EDEBF5" fill-opacity="0.14"/>

    <rect x="486" y="206" width="42" height="20" fill="#f58134" fill-opacity="0.85"/>
    <rect x="486" y="232" width="70" height="6" fill="#EDEBF5" fill-opacity="0.14"/>
    <line x1="34" y1="256" x2="606" y2="256" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <!-- Partner logo carousel strip -->
  <g>
    <rect x="34" y="278" width="86" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="132" y="278" width="86" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="230" y="278" width="86" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="328" y="278" width="86" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="426" y="278" width="86" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.10" stroke-width="1"/>
    <rect x="524" y="278" width="82" height="34" rx="3" fill="#EDEBF5" fill-opacity="0.03" stroke="#EDEBF5" stroke-opacity="0.06" stroke-width="1"/>
  </g>

  <text x="34" y="366" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">RESPONSIVE REBUILD</text>
  <text x="606" y="366" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">SCROLL COUNT-UP</text>
</svg>
