<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Wireframe of the ecommerce storefront: category rail, product grid and a cart panel">
  <rect x="0" y="0" width="640" height="400" fill="#1C1832"/>

  <g stroke="#EDEBF5" stroke-opacity="0.08" stroke-width="1">
    <line x1="34" y1="40" x2="606" y2="40"/>
    <line x1="34" y1="340" x2="606" y2="340"/>
    <line x1="34" y1="40" x2="34" y2="340"/>
    <line x1="606" y1="40" x2="606" y2="340"/>
    <line x1="446" y1="86" x2="446" y2="340"/>
  </g>

  <!-- category rail -->
  <g>
    <rect x="34" y="54" width="66" height="20" rx="10" fill="#21918C"/>
    <rect x="110" y="54" width="58" height="20" rx="10" fill="#EDEBF5" fill-opacity="0.06" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="1"/>
    <rect x="178" y="54" width="74" height="20" rx="10" fill="#EDEBF5" fill-opacity="0.06" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="1"/>
    <rect x="262" y="54" width="52" height="20" rx="10" fill="#EDEBF5" fill-opacity="0.06" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="1"/>
  </g>

  <!-- product grid: swatch block, name line, price -->
  <g>
    <rect x="34" y="96" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="34" y="96" width="120" height="58" fill="#3B528B"/>
    <rect x="46" y="164" width="72" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="46" y="180" width="34" height="6" fill="#21918C"/>

    <rect x="170" y="96" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="170" y="96" width="120" height="58" fill="#5EC962" fill-opacity="0.55"/>
    <rect x="182" y="164" width="58" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="182" y="180" width="40" height="6" fill="#21918C"/>

    <rect x="306" y="96" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="306" y="96" width="120" height="58" fill="#440154" fill-opacity="0.8"/>
    <rect x="318" y="164" width="84" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="318" y="180" width="30" height="6" fill="#21918C"/>

    <rect x="34" y="222" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="34" y="222" width="120" height="58" fill="#FDE725" fill-opacity="0.6"/>
    <rect x="46" y="290" width="66" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="46" y="306" width="38" height="6" fill="#21918C"/>

    <rect x="170" y="222" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="170" y="222" width="120" height="58" fill="#21918C" fill-opacity="0.7"/>
    <rect x="182" y="290" width="78" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="182" y="306" width="32" height="6" fill="#21918C"/>

    <rect x="306" y="222" width="120" height="110" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="306" y="222" width="120" height="58" fill="#3B528B" fill-opacity="0.7"/>
    <rect x="318" y="290" width="54" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="318" y="306" width="44" height="6" fill="#21918C"/>
  </g>

  <!-- cart panel -->
  <rect x="470" y="96" width="136" height="180" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="484" y="112" width="48" height="7" fill="#EDEBF5" fill-opacity="0.26"/>
  <g>
    <rect x="484" y="136" width="30" height="30" fill="#3B528B" fill-opacity="0.8"/>
    <rect x="524" y="140" width="60" height="6" fill="#EDEBF5" fill-opacity="0.18"/>
    <rect x="524" y="154" width="28" height="6" fill="#EDEBF5" fill-opacity="0.10"/>

    <rect x="484" y="178" width="30" height="30" fill="#5EC962" fill-opacity="0.5"/>
    <rect x="524" y="182" width="48" height="6" fill="#EDEBF5" fill-opacity="0.18"/>
    <rect x="524" y="196" width="28" height="6" fill="#EDEBF5" fill-opacity="0.10"/>
  </g>
  <line x1="484" y1="224" x2="592" y2="224" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="484" y="234" width="40" height="7" fill="#EDEBF5" fill-opacity="0.14"/>
  <rect x="552" y="234" width="40" height="7" fill="#EDEBF5" fill-opacity="0.26"/>
  <rect x="484" y="252" width="108" height="20" fill="#21918C"/>

  <text x="34" y="366" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">CATALOG + CART</text>
  <text x="606" y="366" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">REST API</text>
</svg>
