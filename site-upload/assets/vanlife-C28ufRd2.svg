  <text x="34" y="366" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">SEARCH + BOOK</text>
  <text x="606" y="366" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.6" fill="#9A94B8">FIREBASE AUTH</text>
