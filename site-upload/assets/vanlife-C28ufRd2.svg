<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Wireframe of the Vanlife rental marketplace: filter rail and a grid of van listings">
  <rect x="0" y="0" width="640" height="400" fill="#1C1832"/>

  <g stroke="#EDEBF5" stroke-opacity="0.08" stroke-width="1">
    <line x1="34" y1="40" x2="606" y2="40"/>
    <line x1="34" y1="340" x2="606" y2="340"/>
    <line x1="34" y1="40" x2="34" y2="340"/>
    <line x1="606" y1="40" x2="606" y2="340"/>
    <line x1="176" y1="86" x2="176" y2="340"/>
  </g>

  <!-- search bar + filter chips -->
  <rect x="34" y="54" width="352" height="22" rx="2" fill="#EDEBF5" fill-opacity="0.05" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="1"/>
  <rect x="46" y="61" width="96" height="7" fill="#EDEBF5" fill-opacity="0.16"/>
  <rect x="398" y="54" width="72" height="22" rx="11" fill="#F4713B"/>
  <rect x="482" y="54" width="60" height="22" rx="11" fill="#EDEBF5" fill-opacity="0.06" stroke="#EDEBF5" stroke-opacity="0.16" stroke-width="1"/>

  <!-- filter rail -->
  <g fill="#EDEBF5" fill-opacity="0.14">
    <rect x="34" y="104" width="62" height="7"/>
    <rect x="34" y="126" width="104" height="6"/>
    <rect x="34" y="144" width="88" height="6"/>
    <rect x="34" y="162" width="96" height="6"/>
    <rect x="34" y="196" width="52" height="7"/>
    <rect x="34" y="218" width="98" height="6"/>
    <rect x="34" y="236" width="76" height="6"/>
  </g>
  <rect x="34" y="126" width="4" height="6" fill="#F4713B"/>
  <rect x="34" y="218" width="4" height="6" fill="#F4713B"/>

  <!-- listing cards: image block, title, price -->
  <g>
    <rect x="200" y="96" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="200" y="96" width="122" height="62" fill="#2E6B5E"/>
    <rect x="212" y="168" width="76" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="212" y="184" width="42" height="6" fill="#F4713B"/>

    <rect x="342" y="96" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="342" y="96" width="122" height="62" fill="#4A5B86"/>
    <rect x="354" y="168" width="90" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="354" y="184" width="36" height="6" fill="#F4713B"/>

    <rect x="484" y="96" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="484" y="96" width="122" height="62" fill="#8A5A3C"/>
    <rect x="496" y="168" width="64" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="496" y="184" width="48" height="6" fill="#F4713B"/>

    <rect x="200" y="224" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="200" y="224" width="122" height="62" fill="#3F6E86"/>
    <rect x="212" y="296" width="84" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="212" y="312" width="40" height="6" fill="#F4713B"/>

    <rect x="342" y="224" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="342" y="224" width="122" height="62" fill="#6B4A72"/>
    <rect x="354" y="296" width="70" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="354" y="312" width="44" height="6" fill="#F4713B"/>

    <rect x="484" y="224" width="122" height="112" fill="#EDEBF5" fill-opacity="0.04" stroke="#EDEBF5" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="484" y="224" width="122" height="62" fill="#2E6B5E"/>
    <rect x="496" y="296" width="92" height="7" fill="#EDEBF5" fill-opacity="0.22"/>
    <rect x="496" y="312" width="34" height="6" fill="#F4713B"/>
